<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Attendance Dashboard v4.0</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="brand-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6v12a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3h6a3 3 0 0 1 3 3zm0 0h6a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-6"/><circle cx="9" cy="9" r="2"/><path d="m6 17 2-2 2 2"/></svg>
        </div>
        <h1>Smart Face Recognition Dashboard</h1>
      </div>
      <div class="header-status">
        <div class="time-clock" id="live-clock">00:00:00</div>
        <div class="badge-live">LIVE MONITORING</div>
      </div>
    </header>

    <!-- Stats Grid -->
    <div class="stats-grid">
      <div class="stat-card cyan">
        <h3>Total Registered</h3>
        <div class="value" id="stat-reg">0</div>
      </div>
      <div class="stat-card green">
        <h3>Present Today</h3>
        <div class="value" id="stat-present">0</div>
      </div>
      <div class="stat-card amber">
        <h3>Late Arrivals</h3>
        <div class="value" id="stat-late">0</div>
      </div>
      <div class="stat-card red">
        <h3>Absent Students</h3>
        <div class="value" id="stat-absent">0</div>
      </div>
    </div>

    <!-- Main Grid -->
    <div class="main-grid">
      <!-- Left Column: Live Camera Feed Box -->
      <div class="panel">
        <div class="panel-header">
          <h2 class="panel-title">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent-cyan)" stroke-width="2.5"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
            Live Camera Video Feed
          </h2>
        </div>
        <div class="video-container">
          <img src="/video_feed" alt="Live Camera Video Feed" onerror="this.onerror=null; this.src=''; this.alt='Camera feed initializing or active in desktop mode';">
        </div>
      </div>

      <!-- Right Column: Today's Logs & Roster -->
      <div style="display: flex; flex-direction: column; gap: 1.5rem;">
        <div class="panel">
          <div class="panel-header">
            <h2 class="panel-title">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent-green)" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
              Today's Attendance Logs
            </h2>
          </div>
          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <th>Student Name</th>
                  <th>Time Logged</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="attendance-table-body">
                <tr><td colspan="3" style="text-align:center; color: var(--text-muted);">Loading live logs...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <h2 class="panel-title">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent-blue)" stroke-width="2.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              Enrolled Roster
            </h2>
          </div>
          <div class="student-list" id="student-roster">
            <div style="color: var(--text-muted);">Loading registered students...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById('live-clock').innerText = now.toTimeString().split(' ')[0];
    }
    setInterval(updateClock, 1000);
    updateClock();

    async function fetchData() {
      try {
        const resStats = await fetch('/api/summary');
        const stats = await resStats.json();
        
        document.getElementById('stat-reg').innerText = stats.total_registered || 0;
        document.getElementById('stat-present').innerText = stats.present_count || 0;
        document.getElementById('stat-late').innerText = stats.late_count || 0;
        document.getElementById('stat-absent').innerText = stats.absent_count || 0;

        const resRecords = await fetch('/api/records');
        const records = await resRecords.json();
        
        const tbody = document.getElementById('attendance-table-body');
        if (records.length === 0) {
          tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color: var(--text-muted);">No records logged today.</td></tr>';
        } else {
          tbody.innerHTML = records.map(r => `
            <tr>
              <td style="font-weight: 700;">${r.name}</td>
              <td>${r.time}</td>
              <td><span class="status-pill ${r.status === 'On Time' ? 'on-time' : 'late'}">${r.status}</span></td>
            </tr>
          `).join('');
        }

        const resStudents = await fetch('/api/students');
        const students = await resStudents.json();
        const rosterDiv = document.getElementById('student-roster');
        rosterDiv.innerHTML = students.map(s => `
          <div class="student-item">
            <span style="font-weight:600;">${s}</span>
            <span style="font-size:0.8rem; color: var(--accent-green); background: rgba(16,185,129,0.1); padding: 0.2rem 0.6rem; border-radius:12px;">Active</span>
          </div>
        `).join('');

      } catch (err) {
        console.error("Failed to update dashboard data:", err);
      }
    }

    fetchData();
    setInterval(fetchData, 2500);
  </script>
</body>
</html>
